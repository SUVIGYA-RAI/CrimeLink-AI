<!-- Unified Navigation Bar for Level 2 Intelligence Suite -->
<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4 p-2 rounded" style="background:#111b2b;border:1px solid #1e3a5f;">
    <div class="d-flex align-items-center gap-1 flex-wrap">
        <a href="{% url 'data_management:index' %}" class="btn btn-sm {% if request.resolver_match.app_name == 'data_management' and 'preview' not in request.path and 'upload' not in request.path and 'files' not in request.path %}btn-info text-dark{% else %}btn-outline-secondary{% endif %}">
            <i class="bi bi-cloud-upload me-1"></i>Data Management
        </a>
        <a href="{% url 'data_management:file_list' %}" class="btn btn-sm {% if 'files' in request.path %}btn-info text-dark{% else %}btn-outline-secondary{% endif %}">
            <i class="bi bi-folder2 me-1"></i>Uploaded Files
        </a>
        <a href="{% url 'ai_analysis:home' %}" class="btn btn-sm {% if request.resolver_match.app_name == 'ai_analysis' and 'relationship' not in request.path and 'alert' not in request.path and 'entities' not in request.path %}btn-primary{% else %}btn-outline-secondary{% endif %}">
            <i class="bi bi-cpu me-1"></i>AI Analysis
        </a>
        <a href="{% url 'ai_analysis:relationship_list' %}" class="btn btn-sm {% if 'relationship' in request.path %}btn-success{% else %}btn-outline-secondary{% endif %}">
            <i class="bi bi-link-45deg me-1"></i>Relationships
        </a>
        <a href="{% url 'ai_analysis:alert_list' %}" class="btn btn-sm {% if 'alert' in request.path %}btn-warning text-dark{% else %}btn-outline-secondary{% endif %}">
            <i class="bi bi-exclamation-triangle me-1"></i>Anomaly Alerts
        </a>
        <a href="{% url 'network_analysis:network_graph' %}" class="btn btn-sm {% if 'graph' in request.path %}btn-cyan text-dark{% else %}btn-outline-secondary{% endif %}">
            <i class="bi bi-diagram-3 me-1"></i>Interactive Graph
        </a>
    </div>
    <div class="d-flex align-items-center gap-2">
        <a href="{% url 'data_management:upload' %}" class="btn btn-sm btn-outline-info">
            <i class="bi bi-plus-lg me-1"></i>Upload File
        </a>
        <a href="{% url 'dashboard:home' %}" class="btn btn-sm btn-outline-secondary" title="Back to Dashboard">
            <i class="bi bi-house me-1"></i>Dashboard
        </a>
    </div>
</div>
