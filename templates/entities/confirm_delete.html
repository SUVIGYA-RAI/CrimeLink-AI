{% extends "base.html" %}

{% block title %}Confirm Delete - CrimeLink AI{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card" style="border:1px solid var(--danger);">
            <div class="card-header text-danger">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirm Deletion
            </div>
            <div class="card-body text-center py-4">
                <div style="font-size:48px;color:var(--danger);opacity:0.6;" class="mb-3">
                    <i class="bi bi-trash3-fill"></i>
                </div>
                <h5>Delete {{ type }}</h5>
                <p class="text-muted-custom mb-0">{{ obj }}</p>
                <p class="text-danger small mt-2">This action cannot be undone.</p>
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="bi bi-trash me-1"></i>Yes, Delete
                        </button>
                        <a href="{% url back_url %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
